# Statistic (B) at the operating lag — the own run on a SECOND FAMILY, Llama-3.2-3B (design §14.5, R-F1–R-F10 as
# ruled 2026-10-23). UNREGISTERED until a numbered entry fixes every value below; `reader run` refuses while
# registered_by is empty or any *_PENDING pin remains.
#
# The recipe is 0017's unchanged (tools/own_run.py, the same arguments; pins as 0029's sitting: trl==1.15.0
# (dae7b6adc8d2729cfa8d21bc8480656ede769240), transformers 5.20.2, torch 2.14.1+cu130; lr 1e-6, beta 0, 16 prompts x 8
# completions per step, T 1.0, 256-token completions, fp32 master weights, gradient checkpointing, trainer seed 0, 32
# steps, keep {0, 1, 2, 4, 8, 16, 32}, dumps every step) with ONE departure, disclosed in the registering entry (R-F2):
# the base ships no chat template, so prompts are rendered PLAIN — `{SYSTEM_LINE}\n\nQuestion: {q}\nAnswer:`, the same
# system line — under [trainer] prompt_format below and `--prompt-format plain` on both own_run.py commands. The Qwen
# cells (0017–0029) ran under Qwen's template and are not re-run; every comparison to them crosses this change.
#
# Pairs: the held-out corpus windows are the instrument's own for the pair whose source is the trained model
# (`llama3.2-3b-to-llama3.1-8b`, pairs.py at 5d4aa4a; FineWeb-Edu, 50 x 1024, seed 0; rows 40..49 held out as 0017);
# the rollout rows are the ten GSM8K train prompts 0017 chose (`select_prompt_indices(seed 0)` is model-independent:
# {123, 306, 562, 1309, 2014, 2298, 3816, 4754, 6077, 6349}), one completion each sampled from THIS family's step-0
# policy at T 1.0 under the plain format, >= 64 tokens, excluded from the batches; hashes pinned at registration.
# Controls per (reader, pair) as 0028 (`per_pair`, `far_pair`, `evaluable_under_far`). `agentic` is not registered here.
#
# Labels carry `llama` so results/distance/rungs/<label> never collides with the Qwen runs; the trainer hook writes
# results/distance/ownrun/step_<g>.json on the pod — at home those files are placed under results/distance/ownrun_llama/.

[trainer]
# read by the pod script and the registering entry, not by the reader (the reader's tables are [reader.*])
model = "meta-llama/Llama-3.2-3B@13afe5124825b4f3751f836b40dafda64c1ed062"
prompt_format = "plain"
kvt_pair = "llama3.2-3b-to-llama3.1-8b"
trl = "trl==1.15.0 (dae7b6adc8d2729cfa8d21bc8480656ede769240)"
transformers = "5.20.2"
torch = "2.14.1+cu130"
seed = 0
steps = 32
keep = [0, 1, 2, 4, 8, 16, 32]

[reader]
results_dir = "results/ownrun_llama"
upstream_path = "../kv-transfer-replication"
upstream_sha = "5d4aa4a98b40f5ab37dd83ebb6b2ee802203994a"
heldout = [40, 50]
prefix_len = 768
dtype = "float32"
seed = 0
registered_by = ""
seal = "ownrun-llama"

[reader.rule]
statistic = "median over held-out sequences of the mean per-token KL(pi_fresh || pi_stale) over the continuation, per rung and text (design S13, ledger 0011)"
holds_max = 1e-3
degrades_min = 1e-1
texts = ["corpus", "on-path"]
generate_under = "stale"

[reader.controls]
per_pair = true
identity_max_logit_diff = 1e-5
scrambled_min = 1e-1
floor_max_median_kl = 1e-4
# 0022's far limit, and 0028's pre-committed rule: scrambled missed + far cleared = EVALUABLE under far.
far_min = 1e-1
evaluable_under_far = true

# The held-out corpus windows: the instrument's own token file for the Llama pair (sha256 of the file at 5d4aa4a's rule).
[[reader.pairs]]
name = "llama3.2-3b-to-llama3.1-8b"
tokens = "data/tokens/llama3.2-3b-to-llama3.1-8b_n50_len1024_seed0.npy"
tokens_sha256 = "2a79dbe4c8b59f245d876426f2b930d36df8696c0dc9e91e9718ef220170af21"

# The rollout rows (R-C6 on this family): prompt = prefix, sampled completion = continuation; hashes pinned at registration.
[[reader.pairs]]
name = "llama3.2-3b-ownrun-rollout"
tokens = "data/tokens/llama3.2-3b-ownrun_rollout_n10_seed0.npy"
tokens_sha256 = "ROLLOUT_TOKENS_SHA256_PENDING"
spans = "data/tokens/llama3.2-3b-ownrun_rollout_n10_seed0.spans.json"
spans_sha256 = "ROLLOUT_SPANS_SHA256_PENDING"
heldout = [0, 10]
# 0022: rollout sequence i's far prefix is the held-out pair's reader dump of sequence 40 + i (this run's own dumps).
far_pair = "llama3.2-3b-to-llama3.1-8b"

# Lag rungs on the held-out corpus: writer step 0, reader step g. Labels fix the distance-file names.
[[reader.rungs]]
label = "ownrun-llama-lag-1"
pair = "llama3.2-3b-to-llama3.1-8b"
reader = "local:step_1"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_1"

[[reader.rungs]]
label = "ownrun-llama-lag-2"
pair = "llama3.2-3b-to-llama3.1-8b"
reader = "local:step_2"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_2"

[[reader.rungs]]
label = "ownrun-llama-lag-4"
pair = "llama3.2-3b-to-llama3.1-8b"
reader = "local:step_4"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_4"

[[reader.rungs]]
label = "ownrun-llama-lag-8"
pair = "llama3.2-3b-to-llama3.1-8b"
reader = "local:step_8"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_8"

[[reader.rungs]]
label = "ownrun-llama-lag-16"
pair = "llama3.2-3b-to-llama3.1-8b"
reader = "local:step_16"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_16"

[[reader.rungs]]
label = "ownrun-llama-lag-32"
pair = "llama3.2-3b-to-llama3.1-8b"
reader = "local:step_32"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_32"

# The same lags on the rollout text (R-C4): the reader scores the step-0 sample under its own prompt cache and
# under step 0's. The rollout pair's controls run per reader on rollout text (per_pair).
[[reader.rungs]]
label = "ownrun-llama-rollout-lag-1"
pair = "llama3.2-3b-ownrun-rollout"
reader = "local:step_1"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_1"
texts = ["rollout"]

[[reader.rungs]]
label = "ownrun-llama-rollout-lag-2"
pair = "llama3.2-3b-ownrun-rollout"
reader = "local:step_2"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_2"
texts = ["rollout"]

[[reader.rungs]]
label = "ownrun-llama-rollout-lag-4"
pair = "llama3.2-3b-ownrun-rollout"
reader = "local:step_4"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_4"
texts = ["rollout"]

[[reader.rungs]]
label = "ownrun-llama-rollout-lag-8"
pair = "llama3.2-3b-ownrun-rollout"
reader = "local:step_8"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_8"
texts = ["rollout"]

[[reader.rungs]]
label = "ownrun-llama-rollout-lag-16"
pair = "llama3.2-3b-ownrun-rollout"
reader = "local:step_16"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_16"
texts = ["rollout"]

[[reader.rungs]]
label = "ownrun-llama-rollout-lag-32"
pair = "llama3.2-3b-ownrun-rollout"
reader = "local:step_32"
writer_dump = "source@local-step_0"
reader_dump = "source@local-step_32"
texts = ["rollout"]
