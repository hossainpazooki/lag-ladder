# Statistic (B), "does the reader notice" (design §13, ruled 2026-10-10, ledger 0011): inject a stale
# (writer's) vs fresh (reader's own) float16 KV cache of the 768-token prefix into the reader and score the
# 256-token continuation. Cells reuse the 0008 dumps under results/distance/ as-is (R-B11); nothing is
# re-dumped. UNREGISTERED: registered_by is empty and the floor limits are unset until the pre-registration
# float16-floor probe (R-B9); the registering entry (0012) fixes both, and `run` refuses until then.
# The R-B4 (lag-ladder re-dump) and R-B8 (Qwen isotropic) rungs are added by the registering entry once
# their dumps exist; this file ships with the thirteen rungs of 0008.
[reader]
results_dir = "results/reader"
upstream_path = "../kv-transfer-replication"
upstream_sha = "5d4aa4a98b40f5ab37dd83ebb6b2ee802203994a"
heldout = [40, 50]
prefix_len = 768
dtype = "float32"
seed = 0
registered_by = ""

[reader.rule]
statistic = "median over held-out sequences of the mean per-token KL(pi_fresh || pi_stale) over the 256-token continuation, per rung and text"
holds_max = 1e-3
degrades_min = 1e-1
texts = ["corpus", "on-path"]
# R-B7a: the on-path continuation is generated under the STALE cache (the trainer's scenario).
generate_under = "stale"

[reader.controls]
# Identity: a determinism check on the maximum logit difference, not "any nonzero" (R-B10).
identity_max_logit_diff = 1e-5
# Scrambled: the next held-out sequence's prefix, corpus text; median mean-KL must reach this or the
# reader's rungs are UNEVALUABLE.
scrambled_min = 1e-1
# Float16 floor (the halting control, R-B10): limits fixed by 0012 from the probe. Unset until then;
# `run` refuses while they are missing, `probe` does not need them.
# floor_max_logit_diff = <from the probe>
# floor_max_median_kl = <from the probe>

# Token files: identical to the distance registration (0008); P = tokens[:768], C = tokens[768:1024].
[[reader.pairs]]
name = "olmo2-1b-rlvr1"
tokens = "data/tokens/olmo2-1b-rlvr1_n50_len1024_seed0.npy"
tokens_sha256 = "462a7a743326085462a8fdf0f7a63d79045167e71b596230117066e7ac2eeeeb"

[[reader.pairs]]
name = "qwen2.5-1.5b-to-instruct"
tokens = "data/tokens/qwen2.5-1.5b-to-instruct_n50_len1024_seed0.npy"
tokens_sha256 = "01bd7698f7413ab9a3b6958991487bbba626f5a8cc4f24142cd22091d96af747"

[[reader.pairs]]
name = "qwen2.5-1.5b-to-math"
tokens = "data/tokens/qwen2.5-1.5b-to-instruct_n50_len1024_seed0.npy"
tokens_sha256 = "01bd7698f7413ab9a3b6958991487bbba626f5a8cc4f24142cd22091d96af747"

[[reader.pairs]]
